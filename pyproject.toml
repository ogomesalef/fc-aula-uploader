[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aula-uploader"
version = "0.1.0"
description = "CLI para criar capítulos e enviar aulas (vídeos) a um portal administrativo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aula-uploader contributors" }]
keywords = ["portal", "upload", "aulas", "capitulos"]
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "questionary>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
]

[project.scripts]
aula-uploader = "aula_uploader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
